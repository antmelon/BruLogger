# Runs the same checks as `npm test && npm run typecheck && npm run lint` plus the production
# web build, on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches the Vercel build
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build the web app
        run: npx expo export --platform web
